name: Temporary format issue 268

on:
  push:
    branches:
      - docs/268-native-mcp-issuer-architecture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/268-native-mcp-issuer-architecture

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Format architecture document
        run: |
          sed -i 's#https://modelcontextprotocol.io/specification/draft/basic/authorization#https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#g' docs/NATIVE_MCP_ISSUER_GATEWAY.md
          pnpm exec prettier --write docs/NATIVE_MCP_ISSUER_GATEWAY.md
          git rm .github/workflows/tmp-format-268.yml

      - name: Commit formatted document and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NATIVE_MCP_ISSUER_GATEWAY.md
          git add -u .github/workflows/tmp-format-268.yml
          git commit -m "docs: format native MCP issuer architecture"
          git push origin HEAD:docs/268-native-mcp-issuer-architecture
