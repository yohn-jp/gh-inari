name: Issue Governance

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate-issue:
    uses: yohn-jp/.github/.github/workflows/issue-governance.yml@main
    with:
      gh-inari-version: "0.5.2"
      invalid-label: "status:invalid"
    permissions:
      contents: read
      issues: write
