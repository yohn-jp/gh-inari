name: Issue Governance

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate-issue:
    name: validate-issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default-branch validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Issue contract
        id: validate
        continue-on-error: true
        run: |
          report=/tmp/issue-governance.md
          output=/tmp/issue-governance.json
          errors=/tmp/issue-governance.stderr
          : > "$report"
          set +e
          node --import tsx scripts/validate-issue.mjs --event "$GITHUB_EVENT_PATH" --report "$report" >"$output" 2>"$errors"
          status=$?
          cat "$output"
          cat "$errors" >&2
          if [ "$status" -ne 0 ] && [ ! -s "$report" ]; then
            printf '%s\n\n%s\n' \
              'Issue governance contract violation:' \
              '- [GOVERNANCE_VALIDATION_FAILED] $: The Issue governance validator did not produce a diagnostic report.' \
              > "$report"
          fi
          exit "$status"

      - name: Mark invalid Issue
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Issue number must be numeric" >&2
            exit 1
          fi
          gh label create "status:invalid" --color D73A4A --description "Issue governance contract violation" --force
          gh issue edit "$ISSUE_NUMBER" --add-label "status:invalid"
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-governance.md

      - name: Clear invalid label
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Issue number must be numeric" >&2
            exit 1
          fi
          gh issue edit "$ISSUE_NUMBER" --remove-label "status:invalid" 2>/dev/null || true
