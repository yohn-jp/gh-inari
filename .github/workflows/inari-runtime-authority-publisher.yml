name: Inari Runtime Authority publisher

run-name: Inari Runtime Authority ${{ github.event.client_payload.correlation }}

on:
  repository_dispatch:
    types: [inari.runtime-authority.publish]

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    if: github.event.action == 'inari.runtime-authority.publish' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install trusted dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Build trusted publisher
        run: corepack pnpm run build

      - name: Publish public Runtime Authority trust
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          INARI_ISSUER_APP_ID: ${{ secrets.INARI_ISSUER_APP_ID }}
          INARI_ISSUER_INSTALLATION_ID: ${{ secrets.INARI_ISSUER_INSTALLATION_ID }}
          INARI_ISSUER_APP_PRIVATE_KEY: ${{ secrets.INARI_ISSUER_APP_PRIVATE_KEY }}
        run: node dist/github/actions-runtime-authority-publisher.js
