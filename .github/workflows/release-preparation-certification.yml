name: Release preparation certification

on:
  pull_request:
    paths:
      - "scripts/release-preparation-certification.mjs"
      - "src/release-preparation.ts"
      - "src/release-preparation-plan.ts"
      - "src/release-pr-publication.ts"
      - "src/pr-publication.ts"
      - "src/release-history-governance.ts"
      - "src/github/release-history-adapter.ts"
      - ".github/inari/pull-requests/release.json"
      - ".github/PULL_REQUEST_TEMPLATE/release.md"
      - "package.json"
      - ".github/workflows/release-preparation-certification.yml"
  push:
    branches: [main]
    paths:
      - "scripts/release-preparation-certification.mjs"
      - "src/release-preparation.ts"
      - "src/release-preparation-plan.ts"
      - "src/release-pr-publication.ts"
      - "src/pr-publication.ts"
      - "src/release-history-governance.ts"
      - "src/github/release-history-adapter.ts"
      - ".github/inari/pull-requests/release.json"
      - ".github/PULL_REQUEST_TEMPLATE/release.md"
      - "package.json"
      - ".github/workflows/release-preparation-certification.yml"

permissions:
  contents: read

jobs:
  certify-release:
    name: Certify release preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify release preparation
        run: pnpm run certify:release
