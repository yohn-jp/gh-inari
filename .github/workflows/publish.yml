name: Publish to npm

# Canonical wrapper distributed via .github/sync.yml (SKIP_PR: true, direct
# push) — do not hand-edit in a consumer repository; edit this file in
# yohn-jp/.github instead.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    uses: yohn-jp/.github/.github/workflows/npm-publish.yml@main
    permissions:
      contents: read
      id-token: write
