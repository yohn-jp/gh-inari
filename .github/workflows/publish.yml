name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    uses: yohn-jp/.github/.github/workflows/npm-publish.yml@main
    with:
      node-version: "22"
      smoke-test-node-versions: "22,24"
      npm-cli-version: "11.5.1"
    permissions:
      contents: read
      id-token: write
