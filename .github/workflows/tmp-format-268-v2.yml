name: Temporary format issue 268 v2

on:
  push:
    branches:
      - docs/268-native-mcp-issuer-architecture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/268-native-mcp-issuer-architecture

      - name: Install pinned formatter
        run: npm install --no-save --ignore-scripts prettier@3.9.6

      - name: Format architecture document
        run: |
          sed -i 's#https://modelcontextprotocol.io/specification/draft/basic/authorization#https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#g' docs/NATIVE_MCP_ISSUER_GATEWAY.md
          ./node_modules/.bin/prettier --write docs/NATIVE_MCP_ISSUER_GATEWAY.md
          git rm .github/workflows/tmp-format-268-v2.yml

      - name: Commit formatter result and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NATIVE_MCP_ISSUER_GATEWAY.md
          git add -u .github/workflows/tmp-format-268-v2.yml
          git commit -m "docs: format native MCP issuer architecture"
          git push origin HEAD:docs/268-native-mcp-issuer-architecture
