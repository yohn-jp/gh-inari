name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    uses: yohn-jp/.github/.github/workflows/pr-governance.yml@main
    with:
      gh-inari-version: "0.5.2"
    permissions:
      contents: read
