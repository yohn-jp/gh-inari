name: gh extension precompiled release

# Canonical wrapper distributed via .github/sync.yml (SKIP_PR: true, direct
# push) — do not hand-edit in a consumer repository; edit this file in
# yohn-jp/.github instead.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: yohn-jp/.github/.github/workflows/gh-extension-release.yml@ff82994d70761f3f40557ea867cfe4915e193965
    with:
      release-tag: ${{ github.event.release.tag_name }}
      certification-verification-script: scripts/verify-gh-extension-release-certification.mjs
    permissions:
      actions: read
      contents: write
