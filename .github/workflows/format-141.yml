name: Format PR 141 test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 141
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/remediation-diagnostics.test.ts
          git add src/remediation-diagnostics.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: format remediation diagnostics checks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
