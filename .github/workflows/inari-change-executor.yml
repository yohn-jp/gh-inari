name: Inari Change executor

run-name: Inari Change ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Semantic Inari Change request JSON
        required: true
        type: string
      correlation:
        description: Adapter-owned request correlation value
        required: true
        type: string
  workflow_call:
    inputs:
      request:
        description: Semantic Inari Change request JSON
        required: true
        type: string
      correlation:
        description: Adapter-owned request correlation value
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  execute:
    # Only the protected default branch may supply the workflow and Core code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Initialize bounded result
        run: |
          mkdir -p "$RUNNER_TEMP/inari-change-result"
          printf '%s\n' '{"ok":false,"error":{"code":"CHANGE_ACTIONS_RUNTIME_INVALID","message":"Trusted Change runtime preparation failed closed.","details":{"stage":"trusted-execution"}}}' > "$RUNNER_TEMP/inari-change-result/result.json"

      - name: Checkout trusted executor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install trusted dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Build trusted executor
        id: build
        run: corepack pnpm run build

      - name: Execute Core plan
        if: steps.build.outcome == 'success'
        env:
          INARI_CHANGE_REQUEST: ${{ inputs.request }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          INARI_ISSUER_APP_ID: ${{ secrets.INARI_ISSUER_APP_ID }}
          INARI_ISSUER_INSTALLATION_ID: ${{ secrets.INARI_ISSUER_INSTALLATION_ID }}
          INARI_ISSUER_APP_PRIVATE_KEY: ${{ secrets.INARI_ISSUER_APP_PRIVATE_KEY }}
        run: |
          set +e
          result_path="$RUNNER_TEMP/inari-change-result/result.json"
          node dist/github/actions-change-executor.js > "$result_path" 2>/dev/null
          execution_status=$?
          if [ ! -s "$result_path" ] || [ "$(wc -c < "$result_path")" -gt 262144 ]; then
            printf '%s\n' '{"ok":false,"error":{"code":"CHANGE_ACTIONS_RUNTIME_INVALID","message":"Trusted Change execution failed closed.","details":{"stage":"trusted-execution"}}}' > "$result_path"
            execution_status=1
          fi
          if ! node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync(process.argv[1], "utf8");
            const result = JSON.parse(raw);
            if (typeof result !== "object" || result === null || Array.isArray(result)) process.exit(1);
          ' "$result_path" >/dev/null 2>/dev/null; then
            printf '%s\n' '{"ok":false,"error":{"code":"CHANGE_ACTIONS_RUNTIME_INVALID","message":"Trusted Change execution failed closed.","details":{"stage":"trusted-execution"}}}' > "$result_path"
            execution_status=1
          fi
          if [ "$execution_status" -ne 0 ]; then
            printf '%s\n' 'Trusted Change executor result:'
            node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(process.argv[1], "utf8");
              const result = JSON.parse(raw);
              if (typeof result !== "object" || result === null || Array.isArray(result)) process.exit(1);
              process.stdout.write(raw);
            ' "$result_path" 2>/dev/null
          fi
          exit "$execution_status"

      - name: Publish bounded result
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: inari-change-result-${{ inputs.correlation }}
          path: ${{ runner.temp }}/inari-change-result/result.json
          if-no-files-found: error
          retention-days: 1
