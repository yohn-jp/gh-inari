name: Inari Change executor

run-name: Inari Change ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Semantic Inari Change request JSON
        required: true
        type: string
      correlation:
        description: Adapter-owned request correlation value
        required: true
        type: string
  workflow_call:
    inputs:
      request:
        description: Semantic Inari Change request JSON
        required: true
        type: string
      correlation:
        description: Adapter-owned request correlation value
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  execute:
    # Only the protected default branch may supply the workflow and Core code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted executor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install trusted dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Execute Core plan
        env:
          INARI_CHANGE_REQUEST: ${{ inputs.request }}
          GITHUB_TOKEN: ${{ github.token }}
          INARI_ISSUER_APP_ID: ${{ secrets.INARI_ISSUER_APP_ID }}
          INARI_ISSUER_INSTALLATION_ID: ${{ secrets.INARI_ISSUER_INSTALLATION_ID }}
          INARI_ISSUER_APP_PRIVATE_KEY: ${{ secrets.INARI_ISSUER_APP_PRIVATE_KEY }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/inari-change-result"
          corepack pnpm run build
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            node dist/github/actions-change-executor.js > "$RUNNER_TEMP/inari-change-result/result.json"
            execution_status=$?
          else
            printf '%s\n' '{"ok":false,"error":{"code":"CHANGE_ACTIONS_RUNTIME_FAILED","message":"Trusted Change execution failed closed."}}' > "$RUNNER_TEMP/inari-change-result/result.json"
            execution_status=$build_status
          fi
          exit "$execution_status"

      - name: Publish bounded result
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: inari-change-result-${{ inputs.correlation }}
          path: ${{ runner.temp }}/inari-change-result/result.json
          if-no-files-found: error
          retention-days: 1
