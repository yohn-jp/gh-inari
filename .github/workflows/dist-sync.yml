name: Dist sync

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: dist-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[dist-sync skip]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint dist-sync App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.DIST_SYNC_APP_ID }}
          private-key: ${{ secrets.DIST_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build from source
        run: corepack pnpm run build

      - name: Detect dist changes
        id: dist-diff
        run: |
          git add -A -- dist
          if git diff --cached --quiet -- dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reproducibility check
        if: steps.dist-diff.outputs.changed == 'true'
        run: |
          corepack pnpm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist is not reproducible: a second consecutive build from the same source produced a further diff."
            git diff --stat -- dist
            exit 1
          fi

      - name: Commit and push dist
        if: steps.dist-diff.outputs.changed == 'true'
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A -- dist
          git commit -m "chore(dist): sync generated dist with main@${GITHUB_SHA:0:7} [dist-sync skip]"
          git push origin HEAD:main
