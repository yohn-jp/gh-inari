name: Dist sync

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: dist-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[dist-sync skip]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build from source
        run: corepack pnpm run build

      - name: Detect dist changes
        id: dist-diff
        run: |
          git add -A -- dist
          if git diff --cached --quiet -- dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reproducibility check
        if: steps.dist-diff.outputs.changed == 'true'
        run: |
          corepack pnpm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist is not reproducible: a second consecutive build from the same source produced a further diff."
            git diff --stat -- dist
            exit 1
          fi

      - name: Commit and push dist
        if: steps.dist-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- dist
          git commit -m "chore(dist): sync generated dist with main@${GITHUB_SHA:0:7} [dist-sync skip]"
          git push origin HEAD:main
