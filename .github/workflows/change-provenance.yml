name: Change provenance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: change-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-provenance:
    name: Change provenance
    runs-on: ubuntu-latest
    steps:
      # --- Golden Path bootstrap enforcement suspension (Issue #437) --------
      #
      # Change provenance enforcement is temporarily suspended while the
      # Inari Golden Path is bootstrapped manually: bootstrap Epic/leaf
      # branches and Draft PRs implement the canonical Change issuance path
      # itself, so they cannot by construction satisfy the merge-admission
      # validator, which already requires PRs to have been issued as
      # healthy canonical Changes.
      #
      # For the duration of this suspension, the job body below replaces
      # the normal checkout / Node setup / dependency install / validate
      # steps with a single explicit no-op, under the same "Change
      # provenance" check identity, so branch protection sees a passing,
      # non-blocking required check without running any of that work. The
      # provenance validator and its tests
      # (scripts/validate-change-merge-admission.mjs, src/change.ts, and
      # their tests) are untouched; they are simply not invoked while this
      # suspension is in effect.
      #
      # Restoration condition: once Inari can execute the canonical path
      # end-to-end and that path has been dogfooded against gh-inari:
      #   governed Issue -> Change issuance -> canonical branch + Draft PR
      #   -> implementation -> Change ready -> review admission
      #
      # To re-enable: revert this commit (restoring the checkout/setup/
      # install/validate steps, and the `permissions:` block they need,
      # from version control history) so the job actually runs the
      # validator again. The act of reverting this diff is the restoration;
      # do not leave any trace of this suspension (comments, conditionals,
      # marker files) behind once restored, and do not introduce a second
      # provenance mechanism during the suspension.
      - name: Change provenance temporarily suspended
        run: |
          echo "Change provenance enforcement is temporarily suspended during Inari Golden Path bootstrap (issue #437)."
          echo "Restore by reverting this workflow change once the canonical Change issuance path has been dogfooded end-to-end against gh-inari."
