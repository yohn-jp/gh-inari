version: 1
branch:
  pattern: "^(feat|fix|docs|refactor|test|chore)/[0-9]+-[a-z0-9-]+$"
templates:
  - template: default
    sections:
      - section: summary
        required: true
      - section: linked_issue
        linkedIssue: true
      - section: changes
        required: true
      - section: validation
        checklist:
          requireComplete: true
      - section: review_focus
        required: false
  - template: release
    sections: []
