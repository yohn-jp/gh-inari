name = "gh-inari-hosted-relay"
main = "dist-hosted-worker/hosted-worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "mcp-inari.yohn.jp"
custom_domain = true

[assets]
directory = "apps/dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/mcp", "/.well-known/*", "/healthz"]

[observability]
enabled = true

# No GitHub App, provider, Session, or Runtime credentials are configured here.
[vars]
INARI_HOSTED_REPOSITORY_HOST = "github.com"
INARI_ENDPOINT_ID = "dashboard-endpoint"
INARI_ENDPOINT_DEPLOYMENT = "shared-hosted"
# Public GitHub App deployment metadata for /.well-known/inari. These values
# are intentionally non-secret; leave them empty until the App is configured.
INARI_GITHUB_APP_ID = "4837577"
INARI_GITHUB_APP_CLIENT_ID = "Iv23liEzznyp0x5l1PlJ"
INARI_GITHUB_APP_SLUG = "inari-issuer"
INARI_GITHUB_APP_INSTALLATION_URL = "https://github.com/apps/inari-issuer/installations/new"
INARI_GITHUB_APP_USER_AUTH_PROFILE = "device-flow"
# Exact HTTPS browser callback registered with the GitHub App.
INARI_GITHUB_APP_CALLBACK_URL = "https://mcp-inari.yohn.jp/oauth/callback"

# Set with `wrangler secret put INARI_GITHUB_APP_CLIENT_SECRET`; never place the
# confidential value in this file or in the public onboarding descriptor.
# Set with `wrangler secret put INARI_GITHUB_WEBHOOK_SECRET`; never place the
# webhook secret in this file or in the public onboarding descriptor.

[[durable_objects.bindings]]
name = "REPOSITORY_RELAY"
class_name = "RepositoryRelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepositoryRelayDurableObject"]
